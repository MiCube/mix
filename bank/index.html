<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行卡号算号器</title>
    <style>
        body {
            font-family: Roboto,"PingFang SC","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #2563eb; }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .input-group { margin-bottom: 1.5rem; }

        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            align-items: center;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover:not(:disabled) { background-color: #1d4ed8; }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .stats {
            font-size: 0.9rem;
            color: #64748b;
            margin-left: auto;
        }

        #resultContainer {
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .rule-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .disclaimer {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 6px;
            color: #9f1239;
            font-size: 0.85rem;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>银行卡号算号器</h1>

        <div class="rule-box">
            <strong>使用规则：</strong><br>
            1. <strong>数字</strong>：固定位。<br>
            2. <strong>字母 (a-z)</strong>：相同字母对应相同数字 (如 aaa 只能是 000, 111...)。<br>
            3. <strong>星号 (*)</strong>：通配符 (如 ** 可以是 01, 12...)。<br>
        </div>

        <div class="input-group">
            <label for="pattern">输入模式</label>
            <input type="text" id="pattern" placeholder="6225 8801 aabb cccc" value="" autocomplete="off">
        </div>

        <div class="controls">
            <button id="btnGenerate" onclick="startGeneration()">生成卡号</button>
            <span class="stats" id="statusText">准备就绪</span>
        </div>

        <div id="resultContainer"></div>

        <div class="disclaimer">
            <strong>⚠️ 免责声明：</strong>
            本工具仅用于算法学习和测试。生成的卡号仅满足 Luhn 算法校验，<strong>不代表真实有效的银行卡</strong>。
            请勿用于任何非法用途或真实交易。
        </div>
    </div>

    <script>
        const MAX_RESULTS = 10000;

        // 输入框自动格式化（修复：第 5 个字符才开始加空格）
        const inputEl = document.getElementById('pattern');

        inputEl.addEventListener('input', function(e) {
            const cursorPos = e.target.selectionStart;
            const newValue = e.target.value;

            // 1. 移除所有空格，获取纯内容
            let cleanVal = newValue.replace(/\s/g, '');
            // 只保留数字、字母、星号
            cleanVal = cleanVal.replace(/[^0-9a-zA-Z*]/g, '');

            // 2. 每 4 个字符加一个空格，但只在后面还有字符时才加
            // 例如：6221 不加空格，62212 变成 6221 2
            let formattedVal = cleanVal.replace(/(.{4})(?=.)/g, '$1 ');

            // 3. 计算光标位置
            // 计算光标前的有效字符数（不含空格）
            const rawBeforeCursor = newValue.substring(0, cursorPos).replace(/\s/g, '');
            const validCharsBeforeCursor = rawBeforeCursor.replace(/[^0-9a-zA-Z*]/g, '').length;

            // 在格式化后的字符串中，每完整 4 个字符组后面有一个空格
            // 但最后一组如果不完整则没有空格
            // 所以光标前的空格数 = Math.floor((有效字符数 - 1) / 4)
            const spacesBeforeCursor = validCharsBeforeCursor > 0 ? Math.floor((validCharsBeforeCursor - 1) / 4) : 0;
            const newCursorPos = validCharsBeforeCursor + spacesBeforeCursor;

            // 4. 更新输入框
            if (newValue !== formattedVal) {
                e.target.value = formattedVal;
                e.target.selectionStart = e.target.selectionEnd = newCursorPos;
            }
        });

        // Luhn 算法校验
        function luhnCheck(cardNumber) {
            let sum = 0;
            let isSecond = false;
            for (let i = cardNumber.length - 1; i >= 0; i--) {
                let digit = parseInt(cardNumber[i]);
                if (isSecond) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
                isSecond = !isSecond;
            }
            return sum % 10 === 0;
        }

        // 格式化输出 (每 4 位加空格)
        function formatCard(card) {
            return card.replace(/(.{4})/g, '$1 ').trim();
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startGeneration() {
            const rawInput = document.getElementById('pattern').value;
            const resultContainer = document.getElementById('resultContainer');
            const statusText = document.getElementById('statusText');
            const btnGenerate = document.getElementById('btnGenerate');

            const cleanInput = rawInput.replace(/\s+/g, '').toLowerCase();

            if (!cleanInput) {
                alert("请输入包含数字、字母或 * 的模式");
                return;
            }

            // 解析模式
            const pattern = [];
            const uniqueLinks = new Set();
            let totalVariables = 0;

            for (let i = 0; i < cleanInput.length; i++) {
                const char = cleanInput[i];
                if (/[0-9]/.test(char)) {
                    pattern.push({ type: 'fixed', val: char });
                } else if (/[a-z]/.test(char)) {
                    pattern.push({ type: 'link', val: char });
                    uniqueLinks.add(char);
                } else if (char === '*') {
                    pattern.push({ type: 'star', val: `star_${i}` });
                    totalVariables++;
                }
            }

            totalVariables += uniqueLinks.size;

            if (totalVariables > 9) {
                if(!confirm(`警告：变量位数过多 (${totalVariables} 位)，计算量巨大。\n是否继续？`)) {
                    return;
                }
            }

            // 初始化 UI
            btnGenerate.disabled = true;
            btnGenerate.textContent = "生成中...";
            btnGenerate.classList.add('loading-dots');
            resultContainer.textContent = "";
            statusText.textContent = "正在计算...";

            const results = [];

            try {
                await generateAsync(0, {}, pattern, results, (count) => {
                    statusText.textContent = `已找到 ${count} 条...`;

                    if (results.length > 0 && results.length % 200 === 0) {
                        resultContainer.textContent = results.map(formatCard).join('\n');
                    }
                });

                resultContainer.textContent = results.map(formatCard).join('\n');
                statusText.textContent = `完成！共找到 ${results.length} 条。`;

                if (results.length >= MAX_RESULTS) {
                    statusText.textContent += " (已达到显示上限)";
                }

            } catch (e) {
                console.error(e);
                statusText.textContent = "生成中断或出错";
            } finally {
                btnGenerate.disabled = false;
                btnGenerate.textContent = "生成卡号";
                btnGenerate.classList.remove('loading-dots');
            }
        }

        async function generateAsync(index, currentMap, pattern, results, callback) {
            if (results.length >= MAX_RESULTS) return;

            if (index % 3000 === 0) {
                await sleep(0);
                if (results.length >= MAX_RESULTS) return;
            }

            if (index === pattern.length) {
                let cardStr = "";
                for (let p of pattern) {
                    if (p.type === 'fixed') {
                        cardStr += p.val;
                    } else {
                        cardStr += currentMap[p.val];
                    }
                }

                if (luhnCheck(cardStr)) {
                    results.push(cardStr);
                }

                callback(results.length);
                return;
            }

            const node = pattern[index];

            if (node.type === 'fixed') {
                await generateAsync(index + 1, currentMap, pattern, results, callback);
            } else if (node.type === 'link') {
                if (currentMap.hasOwnProperty(node.val)) {
                    await generateAsync(index + 1, currentMap, pattern, results, callback);
                } else {
                    for (let d = 0; d <= 9; d++) {
                        if (results.length >= MAX_RESULTS) break;
                        currentMap[node.val] = d;
                        await generateAsync(index + 1, currentMap, pattern, results, callback);
                    }
                    delete currentMap[node.val];
                }
            } else if (node.type === 'star') {
                for (let d = 0; d <= 9; d++) {
                    if (results.length >= MAX_RESULTS) break;
                    currentMap[node.val] = d;
                    await generateAsync(index + 1, currentMap, pattern, results, callback);
                }
                delete currentMap[node.val];
            }
        }
    </script>
</body>
</html>
